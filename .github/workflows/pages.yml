name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

          # Reconstruct the exact uploaded resume into a normal binary PDF.
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          parts = sorted(Path('assets/resume').glob('part-*.b64.txt'))
          assert len(parts) == 7, f'Expected 7 resume parts, found {len(parts)}'
          payload = ''.join(p.read_text(encoding='utf-8') for p in parts)
          payload = ''.join(payload.split())
          pdf = base64.b64decode(payload, validate=True)
          assert len(pdf) == 95357, f'Unexpected PDF size: {len(pdf)}'
          digest = hashlib.sha256(pdf).hexdigest()
          assert digest == 'fffd5a632203a19aef23e1c4877c759931f1b2267f792c52165a6c201ebfbd8b', digest
          out = Path('_site/assets/Arshaan-Khan-GTM-Resume.pdf')
          out.write_bytes(pdf)
          print(f'Resume verified: {len(pdf)} bytes, sha256={digest}')
          PY

          # Project Pages lives below /arshaan-gtm-portfolio/, so local
          # resources must be relative rather than domain-root-relative.
          sed -i "s#'/evidence/systemize.b64.txt#'evidence/systemize.b64.txt#g" _site/final.js
          sed -i 's/Résumé/Resume/g' _site/index.html
          sed -i 's#</body>#<script src="pages-runtime.js?v=1"></script>\n</body>#' _site/index.html

          # Publish the verified PDF, not the source chunks / legacy payload.
          rm -rf _site/assets/resume
          rm -f _site/assets/arshaan-khan-resume.b64.txt
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
