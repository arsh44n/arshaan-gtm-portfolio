name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

          # GitHub project Pages lives below /arshaan-gtm-portfolio/, so keep
          # local resources project-relative rather than domain-root-relative.
          sed -i "s#'/evidence/systemize.b64.txt#'evidence/systemize.b64.txt#g" _site/final.js
          sed -i 's/Résumé/Resume/g' _site/index.html
          sed -i 's#</body>#<script src="pages-runtime.js?v=2"></script>\n</body>#' _site/index.html

          # Resume source chunks are not public site assets. Resume delivery is
          # handled separately so a PDF issue can never block the whole site.
          rm -rf _site/assets/resume
          rm -f _site/assets/arshaan-khan-resume.b64.txt
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
